<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1F242B">
  <title>Fitmer — фитнес-таймер</title>
  <!-- Витрина для ссылки из шапки Instagram (docs/publishing/install-attribution.md).
       В отличие от /go не перебрасывает в стор сам: показывает живой экран рана,
       голос из приложения и одну кнопку в стор под платформу. Атрибуция та же, что у /go. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Fitmer">
  <meta property="og:title" content="Fitmer — Interval Timer for HIIT, Tabata, EMOM &amp; Rounds">
  <meta property="og:description" content="An interval timer that counts out loud: Tabata, EMOM, AMRAP, For Time and custom intervals.">
  <meta property="og:image" content="https://fitmer.web.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://fitmer.web.app/og-image.png">
  <link rel="icon" href="/favicon.png">
  <style>
    /* Токены дизайн-системы Fitmer, тема Classic · Dark (lib/ui, артефакт DS). */
    @font-face { font-family: Archivo; src: url(/fonts/Archivo-Variable.ttf) format("truetype"); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: Oswald; src: url(/fonts/Oswald-Variable.ttf) format("truetype"); font-weight: 200 700; font-display: swap; }
    :root {
      --ground: #1F242B; --ground-run: #22302A; --surface: #272D36; --surface-inset: #1F242B;
      --track: #404A57; --hairline: rgba(255,255,255,0.06);
      --ink: #EEF1F4; --ink-strong: #FFFFFF; --ink-soft: #C7CED6; --ink-muted: #9AA5B3;
      --brand: #4BDE7F; --on-brand: #0E2417; --rest: #34C3FF; --prepare: #FFB020; --danger: #FF5247;
      --rim-panel: inset 0 1px 0 rgba(255,255,255,0.10); --rim-control: inset 0 1px 0 rgba(255,255,255,0.12);
      --rim-accent: inset 0 1px 0 rgba(255,255,255,0.35); --ring-brand: inset 0 0 0 2px #4BDE7F;
      --ui: Archivo, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --num: Oswald, "Arial Narrow", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--ground); color: var(--ink); font: 400 16px/1.45 var(--ui); }
    main { min-height: 100vh; min-height: 100dvh; max-width: 440px; margin: 0 auto;
      padding: calc(20px + env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 0 max(18px, env(safe-area-inset-left));
      display: flex; flex-direction: column; gap: 18px; }
    .hi { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; color: var(--ink-muted); }
    .mark { font-weight: 900; font-size: 22px; letter-spacing: .5px; color: var(--ink-strong); line-height: 1; }
    .mark span { color: var(--brand); }
    h1 { margin: 0; font-size: 28px; line-height: 1.08; font-weight: 900; color: var(--ink-strong); text-wrap: balance; }

    .stage { border-radius: 26px; background: var(--surface); box-shadow: var(--rim-panel);
      padding: 18px 12px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: background .3s; }
    .stage.work { background: var(--ground-run); }
    .stage .label { font-size: 15px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--ph); }
    .stage .time { font-family: var(--num); font-weight: 600; font-size: 104px; line-height: 1; color: var(--ph); display: inline-flex; }
    /* Каждая цифра — в ячейке фиксированной ширины: таймер не дёргается по горизонтали. */
    .time .dg { display: inline-block; width: .56em; text-align: center; }
    .time .colon { display: inline-block; width: .26em; text-align: center; }
    .stage .meta { font-size: 14px; font-weight: 600; letter-spacing: 1px; color: var(--ink-soft); text-transform: uppercase; font-variant-numeric: tabular-nums; }
    .pips { display: flex; gap: 6px; margin: 2px 0 6px; }
    .pips i { width: 10px; height: 6px; border-radius: 3px; background: var(--track); }
    .pips i.done { background: var(--ph); opacity: .5; }
    .pips i.cur { width: 24px; background: var(--ph); }

    .btn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 58px; padding: 0 22px;
      border: 0; border-radius: 999px; font: 800 16px var(--ui); text-decoration: none; cursor: pointer; white-space: nowrap; }
    .btn--primary { height: 62px; font-size: 17px; font-weight: 900; letter-spacing: .5px; text-transform: uppercase;
      background: var(--brand); color: var(--on-brand); box-shadow: var(--rim-accent); width: 100%; }
    .btn--secondary { background: var(--surface); color: var(--ink); box-shadow: var(--rim-control); }
    .btn--sm { height: 48px; font-size: 15px; padding: 0 18px; }
    .btn--text { background: transparent; color: var(--ink-muted); height: 40px; font-size: 15px; width: 100%; }
    .btn:focus-visible, .chip:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border: 0; font: 800 14px var(--ui); padding: 10px 14px; border-radius: 999px; background: var(--surface);
      box-shadow: var(--rim-control); color: var(--ink); cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
    .chip svg { color: var(--brand); }
    .chip.on { box-shadow: var(--ring-brand); }

    .panel { border-radius: 26px; background: var(--surface); box-shadow: var(--rim-panel); padding: 4px 6px; }
    .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
    .row + .row { border-top: 1px solid var(--hairline); }
    .row b { display: block; font-size: 17px; font-weight: 700; }
    .row span { display: block; font-size: 14px; color: var(--ink-muted); }
    .row svg { flex: none; }

    .codelink { font-size: 15px; color: var(--ink-muted); text-align: center; text-decoration: none; padding: 4px 0 8px; }
    .codelink b { color: var(--brand); font-weight: 800; }

    .dock { position: sticky; bottom: 0; margin: auto calc(-1 * max(18px, env(safe-area-inset-left))) 0;
      padding: 12px max(18px, env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      display: flex; flex-direction: column; gap: 8px; background: var(--ground); box-shadow: var(--rim-panel); }
    .stores { display: flex; gap: 10px; }
    .stores .btn { flex: 1; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="hi"><span class="mark">FIT<span>MER</span></span><span data-t="kind"></span></div>
    <h1 data-t="title"></h1>

    <section class="stage" id="stage" aria-label="Fitmer">
      <span class="label" id="label"></span>
      <span class="time" id="time" aria-hidden="true"></span>
      <span class="meta" id="meta"></span>
      <span class="pips" id="pips"></span>
      <button class="btn btn--secondary btn--sm" id="listen" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7"/></svg>
        <span data-t="listen"></span>
      </button>
    </section>

    <div class="chips" id="chips"></div>

    <section class="panel">
      <div class="row"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4BDE7F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7"/></svg><div><b data-t="f1"></b><span data-t="f1s"></span></div></div>
      <div class="row"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#34C3FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg><div><b data-t="f2"></b><span data-t="f2s"></span></div></div>
      <div class="row"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFB020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7h8v10H8z"/><path d="M9 7l1-4h4l1 4M9 17l1 4h4l1-4"/></svg><div><b data-t="f3"></b><span data-t="f3s"></span></div></div>
    </section>

    <a class="codelink" id="codelink" href="/code/"><span data-t="code"></span> <b data-t="codeGo"></b></a>

    <div class="dock">
      <a class="btn btn--primary" id="main" href="https://fitmer.web.app/online/"></a>
      <div class="stores" id="stores" hidden>
        <a class="btn btn--secondary btn--sm" id="ios" href="#">App Store</a>
        <a class="btn btn--secondary btn--sm" id="android" href="#">Google Play</a>
      </div>
      <a class="btn btn--text" id="web" href="https://fitmer.web.app/online/" data-t="tryWeb"></a>
    </div>
  </main>

  <script>
  (function () {
    // Те же адреса и метки, что у /go (web/go/index.html): менять в обоих местах сразу.
    var APPLE = 'https://apps.apple.com/app/apple-store/id1509055701?pt=121440697&mt=8&ct=';
    var PLAY  = 'https://play.google.com/store/apps/details?id=com.vivchar.fitmer&referrer=';
    var WEB   = 'https://fitmer.web.app/online/';
    var GC    = 'https://fitmer.goatcounter.com/count';

    var p = new URLSearchParams(location.search);
    var ch = (p.get('ch') || 'instagram').toLowerCase();
    if (!/^[a-z0-9_-]{1,40}$/.test(ch)) ch = 'other';
    var camp = (p.get('c') || 'bio').toLowerCase();
    if (!/^[a-z0-9_-]{1,40}$/.test(camp)) camp = 'bio';

    var ua = navigator.userAgent || '';
    var isAndroid = /android/i.test(ua);
    // Android проверяем первым: эмуляторы и часть устройств отдают platform MacIntel с тачем.
    var isIOS = !isAndroid && (/iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1));
    var platform = isIOS ? 'ios' : isAndroid ? 'android' : 'web';

    var ru = /^(ru|uk|be|kk)\b/i.test(navigator.language || '');
    var lang = ru ? 'ru' : 'en';
    var T = {
      ru: { kind: '· фитнес-таймер', title: 'Таймер, который считает за тебя вслух', listen: 'Послушать раунд', listening: 'Слушаем…',
        prepare: 'Приготовься', work: 'Работа', rest: 'Отдых', round: 'Раунд {n} из 3',
        c3: '«Три, два, один»', cWork: '«Работа»', cGong: 'Гонг',
        f1: 'Считает вслух', f1s: 'Не нужно смотреть на экран', f2: 'Табата, EMOM, AMRAP', f2s: 'И ещё три режима',
        f3: 'В фоне и на часах', f3s: 'Apple Watch и Wear OS', code: 'Пришёл за кодом из рилса?', codeGo: 'Как ввести',
        ios: 'Скачать в App Store', android: 'Установить из Google Play', web: 'Открыть в браузере', tryWeb: 'Сначала попробовать в браузере' },
      en: { kind: '· workout timer', title: 'The timer that counts out loud for you', listen: 'Hear a round', listening: 'Listening…',
        prepare: 'Get ready', work: 'Work', rest: 'Rest', round: 'Round {n} of 3',
        c3: '“Three, two, one”', cWork: '“Work”', cGong: 'Gong',
        f1: 'Counts out loud', f1s: 'No need to look at the screen', f2: 'Tabata, EMOM, AMRAP', f2s: 'And three more modes',
        f3: 'In the background and on your watch', f3s: 'Apple Watch and Wear OS', code: 'Got a code from a reel?', codeGo: 'How to enter it',
        ios: 'Download on the App Store', android: 'Get it on Google Play', web: 'Open in your browser', tryWeb: 'Try it in your browser first' }
    }[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = T[el.getAttribute('data-t')]; });

    // ---- ссылки ----
    var iosUrl = APPLE + encodeURIComponent(ch);
    var playUrl = PLAY + encodeURIComponent('utm_source=' + ch + '&utm_medium=social&utm_campaign=' + camp);
    var webUrl = WEB + '?utm_source=' + encodeURIComponent(ch) + '&utm_medium=social';
    var main = document.getElementById('main');
    document.getElementById('ios').href = iosUrl;
    document.getElementById('android').href = playUrl;
    document.getElementById('web').href = webUrl;
    document.getElementById('codelink').href = '/code/?ch=' + encodeURIComponent(ch);
    if (platform === 'ios') { main.href = iosUrl; main.textContent = T.ios; }
    else if (platform === 'android') { main.href = playUrl; main.textContent = T.android; }
    else { main.href = webUrl; main.textContent = T.web; document.getElementById('stores').hidden = false; document.getElementById('web').hidden = true; }

    // ---- клики: виртуальные пути /start/<канал>/<событие> в GoatCounter ----
    function count(ev) {
      try {
        var b = GC + '?p=' + encodeURIComponent('/start/' + ch + '/' + ev);
        if (navigator.sendBeacon) navigator.sendBeacon(b); else { var i = new Image(); i.src = b; }
      } catch (e) {}
    }
    count('view-' + platform);
    main.addEventListener('click', function () { count(platform === 'web' ? 'web' : 'store-' + platform); });
    document.getElementById('ios').addEventListener('click', function () { count('store-ios'); });
    document.getElementById('android').addEventListener('click', function () { count('store-android'); });
    document.getElementById('web').addEventListener('click', function () { count('web'); });
    document.getElementById('codelink').addEventListener('click', function () { count('code'); });

    // ---- звук: голос-пак приложения и сигнал, только по нажатию ----
    var cache = {};
    function play(file) {
      try {
        var a = cache[file] || (cache[file] = new Audio('/start/snd/' + file));
        a.currentTime = 0; var r = a.play(); if (r && r.catch) r.catch(function () {});
      } catch (e) {}
    }
    var chips = document.getElementById('chips');
    [[T.c3, lang + '/3.mp3'], [T.cWork, lang + '/work.mp3'], [T.cGong, 'boxing-gong.mp3']].forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip';
      b.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7"/></svg>';
      b.appendChild(document.createTextNode(c[0]));
      b.addEventListener('click', function () {
        play(c[1]); b.classList.add('on'); setTimeout(function () { b.classList.remove('on'); }, 900); count('sound');
      });
      chips.appendChild(b);
    });

    // ---- живой экран рана: тихая петля; «Послушать» проигрывает раунд с голосом ----
    var LOOP = [{ ph: 'prepare', s: 4, c: 'var(--prepare)' }, { ph: 'work', s: 8, c: 'var(--brand)' }, { ph: 'rest', s: 4, c: 'var(--rest)' }];
    // Секунда от начала петли → реплика; совпадает с цифрами на экране.
    var SCRIPT = [[0, 'get_ready'], [1, '3'], [2, '2'], [3, '1'], [4, 'work'], [8, 'halfway'], [9, '3'], [10, '2'], [11, '1'],
      [12, 'rest'], [13, '3'], [14, '2'], [15, '1'], [16, 'done']];
    var st = { i: 0, left: LOOP[0].s, round: 1 }, listening = false, timers = [];
    var stage = document.getElementById('stage'), timeEl = document.getElementById('time');
    var labelEl = document.getElementById('label'), metaEl = document.getElementById('meta'), pipsEl = document.getElementById('pips');
    var listenBtn = document.getElementById('listen'), listenText = listenBtn.querySelector('span');

    function render() {
      var seg = LOOP[st.i];
      var color = seg.ph === 'work' && st.left <= 2 ? 'var(--danger)' : seg.c;
      stage.style.setProperty('--ph', color);
      stage.classList.toggle('work', seg.ph === 'work');
      labelEl.textContent = T[seg.ph];
      var txt = '0:' + (st.left < 10 ? '0' : '') + st.left;
      timeEl.innerHTML = txt.split('').map(function (ch) {
        return '<span class="' + (ch === ':' ? 'colon' : 'dg') + '">' + ch + '</span>';
      }).join('');
      metaEl.textContent = T.round.replace('{n}', st.round);
      var pips = '';
      for (var r = 1; r <= 3; r++) pips += '<i class="' + (r < st.round ? 'done' : r === st.round ? 'cur' : '') + '"></i>';
      pipsEl.innerHTML = pips;
    }
    var tick = setInterval(function () {
      st.left--;
      if (st.left <= 0) {
        st.i = (st.i + 1) % LOOP.length;
        if (st.i === 0) st.round = st.round % 3 + 1;
        st.left = LOOP[st.i].s;
      }
      render();
    }, 1000);

    listenBtn.addEventListener('click', function () {
      timers.forEach(clearTimeout); timers = [];
      clearInterval(tick);
      st = { i: 0, left: LOOP[0].s, round: 1 }; render();
      tick = setInterval(function () {
        st.left--;
        if (st.left <= 0) { st.i = (st.i + 1) % LOOP.length; if (st.i === 0) st.round = st.round % 3 + 1; st.left = LOOP[st.i].s; }
        render();
      }, 1000);
      listening = true; listenText.textContent = T.listening;
      SCRIPT.forEach(function (x) { timers.push(setTimeout(function () { play(lang + '/' + x[1] + '.mp3'); }, x[0] * 1000)); });
      timers.push(setTimeout(function () { listening = false; listenText.textContent = T.listen; }, 17500));
      count('listen');
    });
    render();
  })();
  </script>
</body>
</html>
